name: ci

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check (bug-catching subset, see pyproject)
        run: ruff check --select F,E9 apex_fuzzer tests

  types:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . mypy
      - name: Mypy (gated scope — ratchets outward, see pyproject)
        run: mypy apex_fuzzer/safety apex_fuzzer/verify
          apex_fuzzer/budgets.py apex_fuzzer/ai

  tests:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[integration]' pytest pyyaml pytest-cov
      - name: "Test suite with coverage (floor: measured baseline)"
        run: python -m pytest tests/ -q --cov=apex_fuzzer
          --cov-report=term-missing --cov-fail-under=70

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pip-audit
      - name: Dependency audit
        run: pip-audit --desc

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build backend
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Build wheel + sdist
        run: python -m build
      - name: Install from sdist (clean check)
        run: |
          pip install --force-reinstall --no-deps dist/*.tar.gz
          python -c "import apex_fuzzer; print(apex_fuzzer.__version__)"

  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image
        run: docker build -t apex-fuzzer:ci .
      - name: "Smoke test (no network: help + config check)"
        run: docker run --rm --network none apex-fuzzer:ci --help
